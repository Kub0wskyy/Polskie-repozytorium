name: Build and Publish Plugins

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: 'src'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugins
        run: |
          cd src
          chmod +x gradlew || true
          gradle make --stacktrace

      - name: Collect Artifacts
        run: |
          mkdir -p output
          find src -name "*.cs3" -exec cp {} output/ \;
          find src -name "plugins.json" -exec cp {} output/ \;
          find src -name "repo.json" -exec cp {} output/ \;

      - name: Deploy to builds Branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: builds
          FOLDER: output
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
