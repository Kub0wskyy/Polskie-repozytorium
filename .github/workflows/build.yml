name: Build and Publish Plugins

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Plugins with Gradle
        run: |
          chmod +x gradlew || true
          ./gradlew make --stacktrace --no-daemon

      - name: Collect Output Files
        run: |
          mkdir -p output
          find . -maxdepth 3 -name "*.cs3" -exec cp {} output/ \;
          find . -maxdepth 3 -name "plugins.json" -exec cp {} output/ \;
          find . -maxdepth 3 -name "repo.json" -exec cp {} output/ \;

      - name: Deploy to builds Branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: builds
          FOLDER: output
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
